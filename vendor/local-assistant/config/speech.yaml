# LocalAssistant — Speech pipeline configuration
#
# Model paths are REAL (filled in by Phase 0.4 model download).
#   ASR : sherpa-onnx streaming zipformer (en, 2023-06-26), int8
#   VAD : Silero VAD (silero_vad.onnx)
#   KWS : sherpa-onnx zipformer GigaSpeech 3.3M (2024-01-01), int8

asr:
  # Streaming transducer (Zipformer) model files.
  tokens: ../models/streaming_asr/tokens.txt
  encoder: ../models/streaming_asr/encoder.onnx
  decoder: ../models/streaming_asr/decoder.onnx
  joiner: ../models/streaming_asr/joiner.onnx
  num_threads: 4
  # Keep the decoder used by the prior hotword-enabled runtime so disabling the
  # invalid BPE hotword list does not also change decoding behavior.
  decoding_method: modified_beam_search
  feature_dim: 80
  sample_rate: 16000
  # Phase 9 — inference-time hotword biasing (CPU-only; no fine-tune needed).
  # A newline-delimited list of command-domain phrases the base model
  # mis-transcribes (app names, command words). Generated by
  # data/gen_hotwords.py. Empty/None disables biasing.
  # NOTE (Phase 9 finding): this model's 500-token BPE SentencePiece vocab
  # cannot encode these word-level hotwords. sherpa-onnx rejects them while
  # still forcing modified-beam search, so biasing is disabled unless a future
  # decoder-matched A/B on a compatible vocabulary proves a benefit.
  hotwords_file: null
  hotwords_score: 1.5

# Phase 9 — post-ASR domain error corrector (fine-tune surrogate).
# Learns (wrong -> right) word substitutions from logs/command_failures.jsonl
# and applies them to the raw transcript before parsing. This is the feasible
# CPU-only stand-in for icefall fine-tuning (no CUDA GPU on this box).
#
# MEASUREMENT (tools/measure_phase9.py, pristine greedy_search baseline
# 73.6% tool / 51.2% exact over 416 clips): the learned confusion pairs
# REGRESS accuracy (best safe subset 70.2% / 48.3%; full set 63.0% / 45.2%)
# because blind whole-word substitution over-corrects on this noisy corpus
# (e.g. "per"->"percent" breaks volume parsing, "eight"->"eighty" turns 8
# into 80). The mechanism is correct and tested, but is LEFT DISABLED so it
# cannot degrade the Phase 8 baseline. Re-enable only after curating a
# context-aware (not blind) corrector. See plan Phase 9 notes.
corrector:
  enabled: false
  min_count: 2
  pairs_file: ../data/asr_corrector_pairs.json

vad:
  # Silero VAD model.
  model: ../models/vad/silero_vad.onnx
  threshold: 0.5
  min_silence_duration: 0.5
  min_speech_duration: 0.25
  no_speech_timeout_seconds: 3.0
  max_utterance_seconds: 12.0

keyword_spotting:
  # sherpa-onnx zipformer GigaSpeech 3.3M (2024-01-01), int8 — transducer (3 files).
  model: ../models/keyword_spotting/encoder.onnx
  decoder: ../models/keyword_spotting/decoder.onnx
  joiner: ../models/keyword_spotting/joiner.onnx
  tokens: ../models/keyword_spotting/tokens.txt
  keywords: ../models/keyword_spotting/keywords.txt
  # Wake phrase(s). DEVIATION (documented in plan): the GigaSpeech 3.3M KWS
  # BPE vocabulary cannot encode "computer"/"hey computer" (tokenizer fails on
  # PUT/PUTER), so the model's supported keyword set is used. "GO HOME" is the
  # designated demo wake word for this model; swap to a model that supports the
  # desired phrase (and update this list) to change it. Must be a keyword that
  # the model can actually encode — otherwise the spotter fails to initialize.
  wake_words:
    - "GO HOME"
